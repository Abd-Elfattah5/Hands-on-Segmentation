[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hands-on-segmentation"
version = "0.1.0"
description = "Clothes segmentation with a U-Net (BCE + Dice), modular PyTorch pipeline for assignment CVCY002"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0",
    "tqdm>=4.66.0",
    "pyarrow>=15.0",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
seg = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
